# FOTA 升级服务部署配置 (纯静态托管)
# 用法: 将本文件放入 nginx 的 conf.d/ 目录 (或在 nginx.conf 的 http 块中 include 本文件), 然后 nginx -s reload
# 独立监听 8089 端口, 不影响 nginx 上已有的其他服务 (前端 8088 / PocketBase 8091)
#
# 目录内容 (/www/tracker_fota/):
#   version.json   版本信息 (设备端比对用, 见仓库 fota/version.json 模板)
#   air780_v2.bin  Luatools 生成的脚本升级包 (发版时覆盖)
server {
    listen 8089;
    server_name _;

    root /www/tracker_fota;

    # version.json 每次发版都会变, 禁止缓存, 保证设备立刻看到新版本
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # 升级包只读下载
    location / {
        try_files $uri =404;
    }
}
